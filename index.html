<!DOCTYPE html>
<html>
  <head>
    <title>RA - Robot Interactivo</title>
    <!-- Librerías de A-Frame y AR.js -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <style>
      /* Botón flotante para la interacción de giro */
      .btn-girar {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 999;
        padding: 14px 28px;
        font-size: 18px;
        font-weight: bold;
        background-color: #28a745;
        color: white;
        border: none;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0,0,0,0.4);
        cursor: pointer;
      }
    </style>
  </head>
  <body style="margin: 0px; overflow: hidden;">

    <!-- Botón para girar el robot -->
    <button class="btn-girar" onclick="girarRobot()">🔄 Girar Robot</button>

    <!-- Escena de Realidad Aumentada -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">

      <!-- Marcador HIRO -->
      <a-marker preset="hiro">

        <!-- Piso de referencia visual -->
        <a-plane position="0 0 0" rotation="-90 0 0" width="4" height="4" color="#7BC8A4" opacity="0.8"></a-plane>

        <!-- CONTENEDOR PRINCIPAL DEL ROBOT -->
        <a-entity id="robot" position="0 0 0" scale="0.8 0.8 0.8" rotation="0 0 0">
          
          <!-- Cabeza (Al tocarla o al tocar el cuerpo, el robot crece) -->
          <a-sphere 
            position="0 1.2 0" 
            radius="0.4" 
            color="blue" 
            class="interactivo" 
            onclick="aumentarTamaño()">
          </a-sphere>

          <!-- Cuerpo (Basado en el pizarrón) -->
          <a-box 
            position="0 0.5 0" 
            rotation="0 45 0" 
            width="0.8" 
            height="0.8" 
            depth="0.8" 
            color="red" 
            class="interactivo" 
            onclick="aumentarTamaño()">
          </a-box>

          <!-- Detalles del rostro -->
          <a-sphere position="-0.15 1.3 0.3" radius="0.08" color="white"></a-sphere>
          <a-sphere position="0.15 1.3 0.3" radius="0.08" color="white"></a-sphere>
          <a-sphere position="-0.15 1.3 0.38" radius="0.03" color="black"></a-sphere>
          <a-sphere position="0.15 1.3 0.38" radius="0.03" color="black"></a-sphere>

        </a-entity>

      </a-marker>

      <!-- Cámara con cursor para permitir toques/clics sobre los objetos 3D -->
      <a-entity camera>
        <a-cursor fuse="false" raycaster="objects: .interactivo"></a-cursor>
      </a-entity>

    </a-scene>

    <!-- FUNCIONES JS SOLICITADAS -->
    <script>
      let gradosRotacion = 0;
      let escalaActual = 0.8;

      // 1. Función para girar el robot al presionar el botón
      function girarRobot() {
        const robot = document.querySelector('#robot');
        gradosRotacion += 45; // Suma 45 grados en cada clic
        robot.setAttribute('rotation', `0 ${gradosRotacion} 0`);
      }

      // 2. Función para aumentar de tamaño al tocar el robot
      function aumentarTamaño() {
        const robot = document.querySelector('#robot');
        escalaActual += 0.2; // Incrementa el tamaño

        // Si se vuelve demasiado grande (más de 2x), se reinicia al tamaño original
        if (escalaActual > 2.0) {
          escalaActual = 0.8;
        }

        robot.setAttribute('scale', `${escalaActual} ${escalaActual} ${escalaActual}`);
      }
    </script>
  </body>
</html>
