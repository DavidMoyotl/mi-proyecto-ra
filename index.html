<!DOCTYPE html>
<html>
  <head>
    <title>Mi objeto 3D en Realidad Aumentada</title>
    <!-- Librería A-Frame -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <!-- Librería AR.js para A-Frame -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <style>
      /* Estilo para el botón flotante de interacción */
      .boton-interaccion {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 999;
        padding: 12px 24px;
        font-size: 16px;
        font-weight: bold;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        cursor: pointer;
      }
    </style>
  </head>
  <body style="margin: 0px; overflow: hidden;">

    <!-- Botón para interactuar con la figura/robot -->
    <button class="boton-interaccion" onclick="rotarYEscalarObjeto()">🤖 ¡Girar y Aumentar Tamaño!</button>

    <!-- Escena configurada con AR.js (detecta marcador y usa cámara web/móvil) -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">

      <!-- Marcador HIRO (El alumno puede mostrar el marcador 'hiro' en otro celular) -->
      <a-marker preset="hiro">

        <!-- 1, 2, 3, 4 y 5. Objeto 3D (Robot compuesto), Piso, Posición, Tamaño y Rotación -->
        
        <!-- PISO O REFERENCIA VISUAL -->
        <a-plane 
          position="0 0 0" 
          rotation="-90 0 0" 
          width="4" 
          height="4" 
          color="#7BC8A4" 
          opacity="0.8">
        </a-plane>

        <!-- CONTENEDOR DEL ROBOT / OBJETO 3D -->
        <a-entity id="miRobot" position="0 0 0" scale="0.8 0.8 0.8" rotation="0 0 0">
          
          <!-- Cabeza (Esfera) - Al tocarla cambia de color -->
          <a-sphere 
            id="cabeza" 
            position="0 1.2 0" 
            radius="0.4" 
            color="blue" 
            class="interactivo">
          </a-sphere>

          <!-- Cuerpo (Cubo Base del Pizarrón) - Al tocarlo cambia de color -->
          <a-box 
            id="cuerpo" 
            position="0 0.5 0" 
            rotation="0 45 0" 
            width="0.8" 
            height="0.8" 
            depth="0.8" 
            color="red" 
            class="interactivo">
          </a-box>

          <!-- Ojos del Robot (Referencia de detalle) -->
          <a-sphere position="-0.15 1.3 0.3" radius="0.08" color="white"></a-sphere>
          <a-sphere position="0.15 1.3 0.3" radius="0.08" color="white"></a-sphere>
          <a-sphere position="-0.15 1.3 0.38" radius="0.03" color="black"></a-sphere>
          <a-sphere position="0.15 1.3 0.38" radius="0.03" color="black"></a-sphere>

        </a-entity>

      </a-marker>

      <!-- Cámara para Realidad Aumentada con soporte de cursor para toques/clics -->
      <a-entity camera>
        <a-cursor fuse="false" raycaster="objects: .interactivo"></a-cursor>
      </a-entity>

    </a-scene>

    <!-- LÓGICA DE INTERACCIÓN (JavaScript + RA) -->
    <script>
      // Lista de colores para cambiar al tocar los objetos
      const colores = ["#FF5733", "#33FF57", "#3357FF", "#F3FF33", "#FF33F3", "#00FFFF"];

      // 1. Interacción al tocar la cabeza o cuerpo (Cambio de color)
      const cabeza = document.querySelector('#cabeza');
      const cuerpo = document.querySelector('#cuerpo');

      function cambiarColorAleatorio(elemento) {
        const colorAleatorio = colores[Math.floor(Math.random() * colores.length)];
        elemento.setAttribute('color', colorAleatorio);
      }

      cabeza.addEventListener('click', function () {
        cambiarColorAleatorio(cabeza);
      });

      cuerpo.addEventListener('click', function () {
        cambiarColorAleatorio(cuerpo);
      });

      // 2. Interacción con el Botón (Girar y Aumentar de tamaño)
      let escalaActual = 0.8;
      let rotacionActual = 0;

      function rotarYEscalarObjeto() {
        const robot = document.querySelector('#miRobot');
        
        // Aumentar rotación en Y
        rotacionActual += 45;
        robot.setAttribute('rotation', `0 ${rotacionActual} 0`);

        // Aumentar tamaño (escala) progresivamente
        escalaActual += 0.15;
        if (escalaActual > 1.6) escalaActual = 0.8; // Reiniciar si se vuelve muy grande
        
        robot.setAttribute('scale', `${escalaActual} ${escalaActual} ${escalaActual}`);
      }
    </script>
  </body>
</html>
